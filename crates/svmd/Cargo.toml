[package]
name = "svmd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.140"
sevenz-rust2 = { version = "=0.25.0", default-features = false }
socket2 = "=0.5.10"
svm-core = { path = "../svm-core" }
svm-hyperv = { path = "../svm-hyperv" }
svm-qemu = { path = "../svm-qemu" }
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "signal"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.9"

[dev-dependencies]
svm = { path = "../svm" }
# The archive writer builds tiny 7z fixtures for the unpack tests only.
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["compress"] }
