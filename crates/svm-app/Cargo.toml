[package]
name = "svm-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
serde_json = "=1.0.140"
svm = { path = "../svm" }

[target.'cfg(windows)'.dependencies]
serde = { version = "=1.0.220", features = ["derive"] }
tao = { version = "=0.37.1", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.0", default-features = false }

[dev-dependencies]
svm-core = { path = "../svm-core" }
svm-hyperv = { path = "../svm-hyperv" }
