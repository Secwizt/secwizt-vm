[package]
name = "svm-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
ring = "=0.17.14"
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=1.0.69"

[dev-dependencies]
# For the live DHCP check: another program may already hold UDP port 67, and std cannot set SO_REUSEADDR before bind.
socket2 = "0.5"
